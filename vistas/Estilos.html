<style>
  :root {
    --amarillo: #ffc915;
    --amarillo-osc: #e8b400;
    --amarillo-suave: #fff6d6;
    --tinta: #17150f;
    --tinta-2: #45413a;
    --tenue: #807a6c;
    --fondo: #f8f6f0;
    --blanco: #ffffff;
    --borde: #ebe6d9;
    --borde-fuerte: #d6cfbd;
    --verde: #1c8a4c;
    --verde-suave: #e5f4ea;
    --rojo: #c4302b;
    --rojo-suave: #fcebea;
    --ambar: #8a6200;
    --sombra: 0 1px 2px rgba(23, 21, 15, .06), 0 8px 24px rgba(23, 21, 15, .06);
    --radio: 16px;
    --placa: "Barlow Condensed", "Arial Narrow", sans-serif;
    --texto: "Barlow", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--texto); font-size: 15px; background: var(--fondo); color: var(--tinta); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  h1, h2, h3, h4 { margin: 0; font-family: var(--placa); font-weight: 700; letter-spacing: .01em; }
  h2 { font-size: 30px; line-height: 1.1; }
  h3 { font-size: 20px; }
  h4 { font-size: 17px; }
  .tenue { color: var(--tenue); font-size: 14px; margin: 4px 0 0; }

  /* ---------- Placa (componente de marca) ---------- */
  .placa { display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--amarillo); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px;
    box-shadow: inset 0 0 0 3px var(--amarillo), inset 0 0 0 4.5px rgba(23, 21, 15, .55); position: relative; }
  .placa::before, .placa::after { content: ""; position: absolute; top: 9px; width: 7px; height: 7px; border-radius: 50%;
    background: rgba(23, 21, 15, .35); }
  .placa::before { left: 10px; }
  .placa::after { right: 10px; }
  .placa-texto { font-family: var(--placa); font-weight: 700; letter-spacing: .08em; line-height: 1; }
  .placa-ciudad { font-family: var(--placa); font-weight: 600; font-size: 11px; letter-spacing: .32em; line-height: 1; padding-bottom: 8px; }
  .placa-xl { padding: 18px 36px 0; }
  .placa-xl .placa-texto { font-size: 76px; margin-bottom: 4px; }
  .placa-xl .placa-ciudad { font-size: 13px; padding-bottom: 12px; }

  /* ---------- Login ---------- */
  .login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
  .login-marca { background: var(--amarillo); padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 22px;
    background-image: repeating-linear-gradient(-45deg, transparent 0 22px, rgba(23, 21, 15, .035) 22px 44px); }
  .login-marca .placa { align-self: flex-start; background: var(--blanco); box-shadow: inset 0 0 0 3px var(--blanco), inset 0 0 0 4.5px rgba(23, 21, 15, .55), 0 18px 40px rgba(23, 21, 15, .18); }
  .login-marca h1 { font-size: 44px; line-height: 1.05; max-width: 460px; }
  .login-marca p { margin: 0; font-size: 17px; color: var(--tinta-2); max-width: 420px; }
  .login-form { align-self: center; justify-self: center; width: 100%; max-width: 380px; padding: 40px 24px; display: flex; flex-direction: column; gap: 18px; }
  .login-form h2 { font-size: 34px; }
  .legal { font-size: 12px; color: var(--tenue); margin: 0; }

  /* ---------- Formularios y botones ---------- */
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--tinta-2); }
  input, select { font: inherit; font-size: 15px; padding: 11px 14px; border: 1.5px solid var(--borde-fuerte); border-radius: 10px; background: var(--blanco); color: var(--tinta); }
  input:focus, select:focus { outline: none; border-color: var(--tinta); box-shadow: 0 0 0 3px var(--amarillo); }

  .btn { font: inherit; font-weight: 600; font-size: 15px; padding: 11px 18px; border-radius: 10px; border: 1.5px solid var(--borde-fuerte);
    background: var(--blanco); color: var(--tinta); cursor: pointer; transition: background .15s, transform .1s; }
  .btn:hover:not(:disabled) { background: var(--amarillo-suave); border-color: var(--amarillo-osc); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primario { background: var(--tinta); border-color: var(--tinta); color: var(--amarillo); }
  .btn.primario:hover:not(:disabled) { background: #000; color: #ffd84a; }
  .btn.exito { background: var(--amarillo); border-color: var(--tinta); color: var(--tinta); border-width: 2px; }
  .btn.exito:hover:not(:disabled) { background: var(--amarillo-osc); }
  .btn.grande { padding: 14px 26px; font-size: 16px; }

  /* ---------- Estructura ---------- */
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .sidebar { background: var(--blanco); border-right: 1px solid var(--borde); padding: 22px 16px; display: flex; flex-direction: column; gap: 26px;
    position: sticky; top: 0; height: 100vh; }
  .logo { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
  .logo strong { display: block; font-family: var(--placa); font-size: 21px; line-height: 1; }
  .logo small { color: var(--tenue); font-size: 13px; }
  .logo-placa { display: grid; place-items: center; width: 46px; height: 34px; background: var(--amarillo); border: 2.5px solid var(--tinta);
    border-radius: 7px; font-family: var(--placa); font-weight: 700; font-size: 19px; letter-spacing: .06em; }
  .menu { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .menu a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: var(--tinta-2); text-decoration: none; font-weight: 600; }
  .menu a svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .menu a:hover { background: var(--fondo); color: var(--tinta); }
  .menu a.activo { background: var(--amarillo); color: var(--tinta); box-shadow: inset 3px 0 0 var(--tinta); }
  .usuario { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--fondo); }
  .avatar { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--tinta); color: var(--amarillo);
    font-family: var(--placa); font-weight: 700; font-size: 18px; flex: none; }
  .usuario-datos { min-width: 0; flex: 1; }
  .usuario-datos strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .usuario-datos small { color: var(--tenue); font-size: 12px; }
  .btn-salir { font: inherit; font-size: 13px; font-weight: 600; border: none; background: none; color: var(--tinta-2); cursor: pointer; padding: 6px; text-decoration: underline; }

  .contenido { padding: 30px 36px 48px; min-width: 0; }
  .cabecera { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }

  /* ---------- Tarjetas y bloques ---------- */
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 18px; }
  .tarjeta { background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px 20px; box-shadow: var(--sombra); }
  .tarjeta .etq { display: block; font-size: 13px; font-weight: 600; color: var(--tenue); text-transform: uppercase; letter-spacing: .06em; }
  .tarjeta strong { display: block; font-family: var(--placa); font-size: 46px; line-height: 1.05; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tarjeta strong.pequeno { font-size: 30px; margin-top: 12px; }
  .tarjeta small { display: block; margin-top: 2px; }
  .tarjeta.destacada { background: var(--amarillo); border-color: var(--amarillo-osc); }
  .tarjeta.destacada .etq, .tarjeta.destacada small { color: var(--tinta-2); }

  .bloque { background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; box-shadow: var(--sombra); margin-bottom: 18px; }
  .bloque.sin-relleno { padding: 0; overflow: hidden; }
  .bloque-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .contador { display: inline-grid; place-items: center; min-width: 28px; height: 24px; padding: 0 8px; margin-left: 6px; border-radius: 99px;
    background: var(--tinta); color: var(--amarillo); font-family: var(--texto); font-size: 13px; vertical-align: 3px; }
  .buscar { min-width: 220px; }
  .pista { margin-top: 14px; }

  /* ---------- Mapa de celdas ---------- */
  .leyenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); }
  .ley::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; }
  .ley.libre::before { border: 1.5px dashed var(--borde-fuerte); background: var(--blanco); }
  .ley.ocupada::before { background: var(--amarillo); border: 1.5px solid var(--tinta); }
  .ley.mantenimiento::before { background: repeating-linear-gradient(135deg, #ece7da 0 3px, #d9d2c0 3px 6px); }
  .grupo + .grupo { margin-top: 22px; }
  .grupo-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .grupo-cab .tenue { margin: 0; }
  .celdas { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
  .celda { height: 88px; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between;
    border: 1.5px dashed var(--borde-fuerte); background: var(--blanco); }
  .celda-cod { font-family: var(--placa); font-weight: 700; font-size: 16px; color: var(--tinta-2); letter-spacing: .04em; }
  .celda-estado { font-size: 13px; font-weight: 600; }
  .celda.libre .celda-estado { color: var(--verde); }
  .celda.libre .celda-estado::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--verde); margin-right: 6px; vertical-align: 1px; }
  .celda.ocupada { background: var(--amarillo); border: 2px solid var(--tinta); cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .celda.ocupada:hover, .celda.ocupada:focus { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(23, 21, 15, .16); outline: none; }
  .celda.ocupada .celda-cod { color: var(--tinta); }
  .celda-placa { align-self: stretch; text-align: center; font-family: var(--placa); font-weight: 700; font-size: 22px; letter-spacing: .08em;
    background: var(--blanco); border: 1.5px solid var(--tinta); border-radius: 6px; padding: 1px 4px; }
  .celda.mantenimiento { border: 1.5px solid var(--borde-fuerte); background: repeating-linear-gradient(135deg, #f3efe5 0 8px, #e7e1d2 8px 16px); }
  .celda.mantenimiento .celda-estado { color: var(--tinta-2); }

  /* ---------- Tablas ---------- */
  .tabla-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  th { font-size: 12px; font-weight: 700; color: var(--tinta-2); text-transform: uppercase; letter-spacing: .06em; background: var(--fondo); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fffcf0; }
  td.vacio { text-align: center; color: var(--tenue); padding: 30px; white-space: normal; }
  .placa-tag { display: inline-block; font-family: var(--placa); font-weight: 700; font-size: 16px; letter-spacing: .08em; background: var(--amarillo);
    color: var(--tinta); border: 1.5px solid var(--tinta); border-radius: 5px; padding: 0 8px; }
  .estado { font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 99px; }
  .estado.ABIERTO { background: var(--verde-suave); color: var(--verde); }
  .estado.CERRADO { background: var(--fondo); color: var(--tenue); }
  .col-barra { width: 32%; }
  .barra { height: 12px; background: var(--amarillo); border: 1.5px solid var(--tinta); border-radius: 4px; min-width: 3px; }

  /* ---------- Entrada / salida ---------- */
  .buscador { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 26px; }
  .placa-input { width: 340px; max-width: 100%; padding: 10px 22px 0; cursor: text; }
  .placa-input input { width: 100%; border: none; background: transparent; padding: 0; text-align: center; font-family: var(--placa);
    font-weight: 700; font-size: 60px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta); line-height: 1.05; }
  .placa-input input::placeholder { color: rgba(23, 21, 15, .22); }
  .placa-input input:focus { box-shadow: none; }
  .placa-input:focus-within { box-shadow: inset 0 0 0 3px var(--amarillo), inset 0 0 0 4.5px rgba(23, 21, 15, .55), 0 0 0 5px rgba(255, 201, 21, .45); }

  .ficha { background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 24px;
    max-width: 820px; border-left: 6px solid var(--verde); }
  .ficha.bloqueada { border-left-color: var(--rojo); }
  .ficha-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px 28px; margin-bottom: 18px; }
  .dato .lbl { display: block; font-size: 12px; color: var(--tenue); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .dato .val { font-size: 17px; font-weight: 600; margin-top: 4px; }
  .alerta { padding: 12px 16px; border-radius: 10px; font-weight: 600; margin-bottom: 14px; }
  .alerta.error { background: var(--rojo-suave); color: var(--rojo); }
  .alerta.warn { background: var(--amarillo-suave); color: var(--ambar); border: 1px solid #f3dc8c; }
  .alerta.ok { background: var(--verde-suave); color: var(--verde); }
  .alerta.caja { max-width: 820px; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .acciones input { flex: 1; min-width: 220px; }

  .filtros { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }

  /* ---------- Avisos y carga ---------- */
  .toast { position: fixed; bottom: 24px; right: 24px; max-width: 400px; padding: 14px 18px; border-radius: 12px; background: var(--tinta);
    color: #fff; font-weight: 600; box-shadow: 0 12px 30px rgba(0, 0, 0, .25); border-left: 6px solid var(--amarillo); z-index: 20; }
  .toast.error { border-left-color: var(--rojo); }
  .cargando { position: fixed; inset: 0; background: rgba(248, 246, 240, .55); display: grid; place-items: center; z-index: 10; }
  .spinner { width: 44px; height: 44px; border: 4px solid var(--amarillo-suave); border-top-color: var(--tinta); border-radius: 50%; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- Gestión: formularios, insignias y ventana emergente ---------- */
  .menu { overflow-y: auto; }
  .menu-titulo { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); padding: 16px 14px 4px; }
  textarea { font: inherit; font-size: 15px; padding: 11px 14px; border: 1.5px solid var(--borde-fuerte); border-radius: 10px; background: var(--blanco);
    color: var(--tinta); resize: vertical; }
  textarea:focus { outline: none; border-color: var(--tinta); box-shadow: 0 0 0 3px var(--amarillo); }
  input[readonly] { background: var(--fondo); color: var(--tenue); }
  .mayus { text-transform: uppercase; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 16px; align-items: end; }
  .form-grid .ancho { grid-column: 1 / -1; }
  .form-grid p { margin: 0; }
  .form-grid.compacto { margin-top: 16px; padding: 16px; background: var(--fondo); border-radius: 12px; }
  label.check { flex-direction: row; align-items: center; gap: 10px; font-size: 15px; color: var(--tinta); padding-bottom: 10px; }
  label.check input { width: 18px; height: 18px; accent-color: var(--tinta); }
  .relleno { padding: 18px 20px 0; }
  .crece { flex: 1; align-self: center; }
  .btn.mini { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .derecha { text-align: right; }
  td.texto { white-space: normal; min-width: 240px; }
  code { font-family: Consolas, monospace; font-size: 13px; background: var(--fondo); padding: 2px 6px; border-radius: 5px; }
  .codigo-celda { font-family: var(--placa); font-size: 17px; letter-spacing: .04em; }
  .insignia { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .insignia.ok { background: var(--verde-suave); color: var(--verde); }
  .insignia.warn { background: var(--amarillo-suave); color: var(--ambar); box-shadow: inset 0 0 0 1px #f3dc8c; }
  .insignia.mal { background: var(--rojo-suave); color: var(--rojo); }
  .insignia.gris { background: var(--fondo); color: var(--tenue); box-shadow: inset 0 0 0 1px var(--borde); }
  .insignia.tinta { background: var(--tinta); color: var(--amarillo); }
  .separador { height: 1px; background: var(--borde); margin: 24px 0 16px; }
  h4 + .tabla-scroll { margin-top: 10px; border: 1px solid var(--borde); border-radius: 12px; }

  .modal-fondo { position: fixed; inset: 0; background: rgba(23, 21, 15, .45); display: grid; place-items: center; padding: 20px; z-index: 15; }
  .modal { background: var(--blanco); border-radius: 20px; width: 100%; max-width: 780px; max-height: calc(100vh - 40px); overflow: auto;
    padding: 22px 26px 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .3); border-top: 6px solid var(--amarillo); }
  .modal-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
  .modal-cab h3 { font-size: 26px; }
  .modal-cerrar { flex: none; border: none; background: var(--fondo); width: 38px; height: 38px; border-radius: 50%; font-size: 22px; line-height: 1;
    cursor: pointer; color: var(--tinta-2); }
  .modal-cerrar:hover { background: var(--amarillo-suave); }
  .toast { z-index: 30; }
  .cargando { z-index: 25; }

  /* Pagos */
  .pagos-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .pagos-grid h3 { margin-bottom: 14px; }
  .buscador.compacto { margin-bottom: 4px; gap: 14px; }
  .placa-input.mini { width: 230px; padding: 6px 16px 0; }
  .placa-input.mini input { font-size: 40px; }
  .placa-input.mini .placa-ciudad { font-size: 9px; padding-bottom: 6px; }
  .ficha.compacta { padding: 18px; margin-top: 16px; box-shadow: none; max-width: none; }
  .ficha.compacta .ficha-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .periodo { background: var(--amarillo-suave); border: 1px dashed var(--amarillo-osc); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .totales { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 14px 20px; font-size: 14px; color: var(--tinta-2); border-bottom: 1px solid var(--borde); }
  .totales strong { font-family: var(--placa); font-size: 20px; color: var(--tinta); }
  #form-pagos { align-items: flex-end; }
  @media (max-width: 1150px) { .pagos-grid { grid-template-columns: 1fr; } }

  /* ---------- Tabletas y pantallas pequeñas (RNF-09) ---------- */
  @media (max-width: 900px) {
    .login { grid-template-columns: 1fr; }
    .login-marca { padding: 32px 24px; }
    .login-marca h1 { font-size: 32px; }
    .placa-xl .placa-texto { font-size: 52px; }
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-right: none; border-bottom: 1px solid var(--borde); }
    .menu { flex-direction: row; overflow-x: auto; order: 3; flex-basis: 100%; }
    .menu-titulo { display: none; }
    .modal { padding: 18px; }
    .menu a { white-space: nowrap; }
    .usuario { margin-left: auto; padding: 6px 10px; }
    .usuario-datos { display: none; }
    .contenido { padding: 20px 16px 40px; }
    .placa-input input { font-size: 46px; }
  }
</style>
